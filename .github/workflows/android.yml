name: Android APK

# Builds the phone app. Publishing a GitHub Release (or pushing a v* tag)
# also attaches the APK to that release; it can be run by hand too.
#
# Signing: when the four TMA_ANDROID_* secrets are set, every APK is signed
# with the same key, so new versions install over old ones and keep the
# data. Without them the APK is signed with a throwaway key: it installs
# fine, but the next build cannot update it in place.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build the app bundle and sync it into the Android project
        run: corepack pnpm build:android

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.TMA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TMA_ANDROID_KEYSTORE_BASE64 is not set; this APK uses a throwaway key and later builds cannot update it in place."
          fi

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          TMA_ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          TMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TMA_ANDROID_KEYSTORE_PASSWORD }}
          TMA_ANDROID_KEY_ALIAS: ${{ secrets.TMA_ANDROID_KEY_ALIAS }}
          TMA_ANDROID_KEY_PASSWORD: ${{ secrets.TMA_ANDROID_KEY_PASSWORD }}
          TMA_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/time-managing-assistant-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-managing-assistant-android
          path: apps/mobile/dist/time-managing-assistant-android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/time-managing-assistant-android.apk
