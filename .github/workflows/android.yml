name: Android APK

# Builds the phone app. Publishing a GitHub Release (or pushing a v* tag)
# also attaches the APK to that release; it can be run by hand too.
#
# Signing: when the four TMA_ANDROID_* secrets are set, every APK is signed
# with the same key, so new versions install over old ones and keep the
# data. Without them the APK is signed with a throwaway key: it installs
# fine, but the next build cannot update it in place.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build the app bundle and sync it into the Android project
        run: corepack pnpm build:android

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.TMA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TMA_ANDROID_KEYSTORE_BASE64 is not set; this APK uses a throwaway key and later builds cannot update it in place."
          fi

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          TMA_ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          TMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TMA_ANDROID_KEYSTORE_PASSWORD }}
          TMA_ANDROID_KEY_ALIAS: ${{ secrets.TMA_ANDROID_KEY_ALIAS }}
          TMA_ANDROID_KEY_PASSWORD: ${{ secrets.TMA_ANDROID_KEY_PASSWORD }}
          TMA_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/time-managing-assistant-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-managing-assistant-android
          path: apps/mobile/dist/time-managing-assistant-android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/time-managing-assistant-android.apk

  # Opens the APK on emulators (an older and a current Android) and checks
  # that it starts in seconds, loads every screen's data and keeps a new task
  # after a restart. See scripts/android-emulator-check.mjs.
  emulator-check:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: time-managing-assistant-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: node scripts/android-emulator-check.mjs apk/time-managing-assistant-android.apk

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screen-api-${{ matrix.api-level }}
          path: emulator-check/
          if-no-files-found: ignore
