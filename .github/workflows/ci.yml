name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit public release boundary
        run: corepack pnpm release:audit

      - name: Type-check workspace
        run: corepack pnpm check

      # Every test uses an in-memory embedded database: nothing to install.
      - name: Unit and API tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build
