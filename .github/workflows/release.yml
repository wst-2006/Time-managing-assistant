name: Windows installer

# Push a tag such as v0.2.0 (or run this workflow by hand) to build the
# Windows installer. Tagged builds attach the .exe to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build installer
        run: corepack pnpm build:desktop

      # Start the bundled Node + API + embedded database once, exactly as the installed app will.
      - name: Smoke-test bundled runtime
        run: corepack pnpm verify:desktop-runtime

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: time-managing-assistant-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
